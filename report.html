in önü kapatılmamış.","Manuel ihbar butonları erişilebilir.","Sirenler çalışıyor.","Alarm panelinde sürekli arıza uyarısı bulunmuyor.","Alarm sistemi enerji beslemesi uygun."]],["Elektrik ve Şarj",["Elektrik panolarının önü açık.","Panolarda yanık/ısınma belirtisi yok.","Geçici ve uygunsuz elektrik tesisatı yok.","Akü/araç şarj alanı ayrılmış.","Şarj alanında yanıcı malzeme bulunmuyor.","Şarj alanı havalandırması uygun.","Şarj kabloları ve bağlantıları hasarsız."]],["Yangın Bölmeleri ve Kaçış",["Yangın kapıları bütünlüğünü koruyor.","Yangın kapıları açık tutulmuyor.","Duvar/döşeme tesisat geçişleri uygun şekilde korunmuş.","Kaçış kapıları açılabilir.","Acil aydınlatmalar çalışıyor.","Çıkış yönlendirmeleri görünür.","Yangın bölmeleri içinde uygunsuz açıklık bulunmuyor."]],["Operasyon ve Personel",["Acil durum planı mevcut.","Yangın ekipleri belirlenmiş.","Personel yangın eğitimi almış.","Tatbikat kayıtları mevcut.","İtfaiye erişim yolu açık.","Yanıcı atıklar düzenli uzaklaştırılıyor.","Sigara/ateş kaynakları kontrollü.","Bakım ve kontrol kayıtları tutuluyor."]]],"KONUT / APARTMAN / SİTE / TOPLU KONUT":[["Bina ve Çevre",["İtfaiye araçlarının bina girişine ve yaklaşım yoluna erişimi açık.","Bina çevresinde müdahaleyi engelleyen araç veya malzeme bulunmuyor.","Bina girişleri ve ortak alanlar düzenli.","Ortak alanlarda yanıcı malzeme depolanmıyor.","Çatıya ve teknik alanlara erişim güvenli.","Yangın güvenliğiyle ilgili mevcut proje ve belgeler erişilebilir."]],["Kaçış Yolları",["Koridorlar kaçış yönünde açık.","Merdivenler kaçış için kullanılabilir durumda.","Kaçış yollarında eşya veya depolama yapılmıyor.","Kaçış yönlendirme işaretleri görünür.","Acil aydınlatmalar çalışır durumda.","Kaçış kapıları kolay açılabilir durumda.","Kaçış kapılarının önünde engel bulunmuyor.","Yangın kapıları işlevini yerine getiriyor.","Yangın merdiveni girişine erişim açık."]],["Yangın Söndürme",["Uygun tipte ve yeterli sayıda taşınabilir söndürücü mevcut.","Söndürücülerin önü açık ve erişilebilir.","Söndürücülerin periyodik kontrol/bakım kayıtları mevcut.","Söndürücülerin basınç ve fiziksel durumları uygun.","Yangın dolaplarının önü açık.","Yangın dolapları kullanılabilir durumda.","Yangın hortumları ve lanslar uygun durumda.","Yangın dolabı vanaları erişilebilir."]],["Alarm ve Acil Sistemler",["Yangın alarm paneli varsa normal çalışma durumunda.","Manuel ihbar butonları erişilebilir.","Duman/ısı dedektörlerinde görünür hasar yok.","Alarm sirenleri çalışır durumda.","Alarm sisteminin enerji beslemesi uygun.","Acil aydınlatma armatürlerinde görünür hasar yok.","Yönlendirme armatürleri görünür ve çalışır."]],["Elektrik ve Teknik Alanlar",["Elektrik panolarının önü açık.","Elektrik panolarında görünür hasar veya yanık izi yok.","Geçici ve uygunsuz elektrik bağlantısı bulunmuyor.","Kablo kanalları ve geçişleri düzenli.","Jeneratör alanı düzenli ve erişilebilir.","Kazan dairesi düzenli ve uygun durumda.","Trafo/elektrik odası erişimi kontrollü.","Teknik hacimlerde yanıcı malzeme depolanmıyor."]],["Bodrum, Otopark ve Çatı",["Bodrum kat kaçış yolları açık.","Otoparkta yangın ekipmanlarının önü açık.","Otoparkta yangın yükünü artıran düzensiz depolama yok.","Kapalı otopark havalandırması çalışır durumda.","Çatı çıkışı ve kaçış yolu açık.","Çatı katında yanıcı malzeme birikimi yok.","Depo/bodrum bölümleri düzenli.","Gaz tesisatı bulunan alanlarda erişim ve güvenlik uygun."]],["Organizasyon ve Belgeler",["Acil durum planı mevcut ve güncel.","Acil durum ekipleri belirlenmiş.","Yangın ekipleri görevleri konusunda bilgilendirilmiş.","Yangın eğitimi kayıtları mevcut.","Tatbikat kayıtları mevcut.","Acil telefon numaraları görünür.","Toplanma alanı belirlenmiş.","Yangın güvenliği sorumluluğu konusunda bina yönetimi bilgilendirilmiş."]],["Site ve İtfaiye Erişimi",["Site ana girişinden itfaiye araçlarının erişimi mümkün.","İtfaiye yolları sürekli açık tutuluyor.","Site içi dönüş ve manevra alanları engellenmemiş.","Blok girişleri açık ve ulaşılabilir.","İtfaiye araçlar unsuz açıklık bulunmuyor.","Konutlarda BYKHY Madde 48 kapsamındaki özel hükümler yapı özellikleriyle uyumlu."]],["BYKHY – Algılama, Alarm ve Söndürme",["Yangın algılama ve uyarı sistemleri gerekli olduğu yerlerde mevcut ve devre dışı bırakılmamış.","Yangın alarm sistemi arıza göstergeleri ve panel kayıtları kontrol edilmiş.","Yangın alarm sisteminin periyodik test ve bakım kayıtları mevcut.","Yangın dolapları ve sabit boru tesisatının erişimi açık ve kullanılabilir.","İtfaiye su verme/su alma bağlantıları gerekli ise erişilebilir ve görünür.","Taşınabilir yangın söndürme cihazlarının tipi ve sayısı risklere uygun.","Taşınabilir yangın söndürme cihazlarının periyodik kontrol ve bakım kayıtları mevcut.","Yağmurlama sistemi bulunan yerlerde vana, alarm ve akış izleme düzenekleri kontrol edilebilir durumda."]],["BYKHY – Sorumluluk, Ekipler ve Denetim",["Yangın güvenliği sorumlusu/yönetici belirlenmiş ve görevleri biliniyor.","Yapı için gerekli yangın güvenliği ekipleri oluşturulmuş.","Gerekli eğitim ve tatbikat kayıtları mevcut.","Yangın güvenliği bakım, test ve kontrol kayıtları düzenli tutuluyor.","Bina yönetimi yangın güvenliği eksikliklerinin giderilmesini takip ediyor."]]]};
const COMMON=["Kaçış yolunun ciddi şekilde kapatılması.","Yangın merdiveninin kullanılamaz olması.","Acil çıkış kapısının kilitli olması.","Yangın kapılarının açık tutulması.","Elektrik panosunda ciddi yanma/ısınma belirtisi.","Gaz kaçağı veya gaz güvenliği şüphesi.","Davlumbaz/bacada yoğun yağ birikimi.","Yangın alarm sisteminin devre dışı olması.","Sprinkler sisteminin devre dışı olması.","Yangın pompasının çalışmaması.","Yanıcı maddelerin kaçış yolunda depolanması.","İtfaiye yaklaşım yolunun tamamen engellenmesi."];
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]) )}
const d=JSON.parse(localStorage.getItem("ydpro_report_v15")||"{}");
let n=0,total=0,answered=0,ok=0,bad=0,out="";
const S=d.statuses||{},R=d.risks||{},N=d.notes||{},A=d.actions||{};
function addSection(title,items){
 let rows="";
 items.forEach(q=>{
   n++; total++;
   const st=S[n]||"İşaretlenmedi",risk=R[n]||"",note=N[n]||"",act=A[n]||"";
   if(st&&st!=="İşaretlenmedi"&&st!=="Kapsam Dışı"){answered++;if(st==="Uygun")ok++;if(st==="Uygunsuz")bad++;}
   rows+=`<tr><td>${n}</td><td>${esc(q)}</td><td>${esc(st)}</td><td>${esc(risk)}</td><td>${esc(note)}</td><td>${esc(act)}</td></tr>`;
 });
 out+=`<h2>${esc(title)}</h2><table><thead><tr><th>No</th><th>Kontrol maddesi</th><th>Durum</th><th>Risk</th><th>Tespit</th><th>Tedbir</th></tr></thead><tbody>${rows}</tbody></table>`;
}
(DB[d.type]||[]).forEach(s=>addSection(s[0],s[1]));
addSection("Ortak Kritik Kontroller",COMMON);

<div class="stats"><div><b>${total}</b>Toplam Madde</div><div><b>${ok}</b>Uygun</div><div><b>${bad}</b>Uygunsuz</div><div><b>${score}%</b>Uygunluk</div></div>
${out}

</div>`;

  if(!sheet){alert("Rapor hazırlanamadı.");return;}
  if(!window.html2canvas || !window.jspdf){
    alert("PDF bileşenleri yüklenemedi. İnternet bağlantınızı kontrol edip tekrar deneyin.");
    return;
  }
  const old=btn.textContent;
  btn.disabled=true; btn.textContent="⏳ PDF HAZIRLANIYOR...";
  try{
    // Temporarily remove UI elements that should never appear in the PDF.
    const canvas=await html2canvas(sheet,{scale:2,useCORS:true,backgroundColor:"#ffffff",logging:false});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4",compress:true});
    const pageW=297, pageH=210;
    const imgW=pageW;
    const pagePx=Math.floor(canvas.width*(pageH/pageW));
    let y=0, page=0;
    while(y<canvas.height){
      const h=Math.min(pagePx,canvas.height-y);
      const pageCanvas=document.createElement("canvas");
      pageCanvas.width=canvas.width; pageCanvas.height=h;
      const ctx=pageCanvas.getContext("2d");
      ctx.fillStyle="#fff"; ctx.fillRect(0,0,pageCanvas.width,h);
      ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      const img=pageCanvas.toDataURL("image/jpeg",0.92);
      if(page>0) pdf.addPage();
      pdf.addImage(img,"JPEG",0,0,imgW,(h/canvas.width)*pageW,"FAST");
      y+=h; page++;
    }
    const blob=pdf.output("blob");
    const fileName="Yangin_Denetim_Raporu_"+new Date().toISOString().slice(0,10)+".pdf";
    const file=new File([blob],fileName,{type:"application/pdf"});
    // On iPhone/iPad, Share -> Save to Files is the most reliable way to save a generated PDF.
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Yangın Denetim Raporu"});
    }else{
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download=fileName; a.rel="noopener";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),3000);
    }
  }catch(e){
    if(e && e.name!=="AbortError"){
      console.error(e);
      alert("PDF oluşturulamadı. Tekrar deneyin.");
    }
  }finally{
    btn.disabled=false; btn.textContent=old;
  }
}


function downloadExcelV17Report(){
  if(typeof XLSX==="undefined"){
    alert("Excel motoru yüklenemedi. İnternet bağlantısını kontrol edip tekrar deneyin.");
    return;
  }
  var d={};
  try{d=JSON.parse(localStorage.getItem("ydpro_report_v15")||"{}");}catch(e){}
  var S=d.statuses||{},R=d.risks||{},N=d.notes||{},A=d.actions||{};
  var rows=[],no=0;
  function legalX(q){
    q=String(q||"").toLowerCase();
    if(/kaçış|merdiven|çıkış|kapı|koridor|tahliye/.test(q))return"BYKHY – Kaçış ve tahliye";
    if(/itfaiye|yaklaşım|hidrant/.test(q))return"BYKHY – İtfaiye erişimi/yaklaşım";
    if(/alarm|dedektör|siren|ihbar/.test(q))return"BYKHY – Algılama ve uyarı";
    if(/dolap|hortum|söndürücü|pompa|su depos/.test(q))return"BYKHY – Söndürme sistemleri";
    if(/sorumlu|ekip|eğitim|tatbikat|acil durum plan/.test(q))return"İşyerlerinde Acil Durumlar Hakkında Yönetmelik / BYKHY";
    if(/elektrik|iş güvenliği/.test(q))return"6331 sayılı Kanun / ilgili mevzuat";
    return"BYKHY / ilgili kullanım hükümleri";
  }
  function add(sec,arr){(arr||[]).forEach(function(q){no++;rows.push({
    "No":no,"Bölüm":sec,"Kontrol Maddesi":q,"Durum":S[no]||"İşaretlenmedi","Risk":R[no]||"",
    "Tespit":N[no]||"","Önerilen Tedbir":A[no]||"","Mevzuat":legalX(q),"Termin":""
  });});}
  (DB[d.type]||[]).forEach(function(sec){add(sec[0],sec[1]);});
  add("Ortak Kritik Kontroller",COMMON||[]);

  var wb=XLSX.utils.book_new();
  var uygun=rows.filter(x=>x["Durum"]==="Uygun").length;
  var uygunsuz=rows.filter(x=>x["Durum"]==="Uygunsuz").length;
  var isaret=rows.filter(x=>!x["Durum"]||x["Durum"]==="İşaretlenmedi").length;
  var summary=[["YANGIN DENETİM PRO V17.2"],["İşletme / Bina",d.name||""],["Yapı Türü",d.type||""],["Adres",d.address||""],
    ["Denetim Tarihi",d.date||""],["Denetçi",d.inspector||""],["Yetkili / Telefon",d.phone||""],[],
    ["Toplam Madde",rows.length],["Uygun",uygun],["Uygunsuz",uygunsuz],["İşaretlenmeyen",isaret],
    ["Uygunluk Oranı",rows.length?Math.round(uygun/Math.max(rows.length-isaret,1)*100)+"%":"0%"]];
  var ws0=XLSX.utils.aoa_to_sheet(summary);ws0["!cols"]=[{wch:28},{wch:65}];XLSX.utils.book_append_sheet(wb,ws0,"Özet");
  var ws1=XLSX.utils.json_to_sheet(rows);ws1["!cols"]=[{wch:6},{wch:26},{wch:58},{wch:18},{wch:12},{wch:45},{wch:45},{wch:50},{wch:16}];
  ws1["!autofilter"]={ref:"A1:I"+(rows.length+1)};ws1["!freeze"]={xSplit:0,ySplit:1};XLSX.utils.book_append_sheet(wb,ws1,"Denetim");
  var bad=rows.filter(x=>x["Durum"]==="Uygunsuz");var ws2=XLSX.utils.json_to_sheet(bad);ws2["!cols"]=ws1["!cols"];
  if(bad.length)ws2["!autofilter"]={ref:"A1:I"+(bad.length+1)};ws2["!freeze"]={xSplit:0,ySplit:1};XLSX.utils.book_append_sheet(wb,ws2,"Uygunsuzluklar");
  var ws3=XLSX.utils.aoa_to_sheet([["Kontrol No","Fotoğraf Dosyası","Açıklama"],["","Fotoğraflar cihazda ayrıca saklanır.","Uygunsuzluk numarası ile eşleştirilebilir."]]);
  ws3["!cols"]=[{wch:14},{wch:45},{wch:70}];XLSX.utils.book_append_sheet(wb,ws3,"Fotoğraflar");
  var fn=(d.name||"Yangin_Denetim").replace(/[\\/:*?"<>|]/g,"_")+"_Denetim_V17_2.xlsx";XLSX.writeFile(wb,fn,{compression:true});
}
